<BOUCLE_principale(ARTICLES) {id_article}>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>#NOM_SITE_SPIP</title>

<INCLURE{fond=inclures/cabeceraparatodos}{env} />



</head>
<body>

<!-- TOPBAR -->
<INCLURE{fond=inclures/topbar}{env} />

<!-- NAVBAR -->
<INCLURE{fond=inclures/navbar}{env} />



<div class="page-hero">
  <div>
     <h1>#TITRE ese </h1>
    <p style="max-width: 700px; margin: 15px auto; opacity: 0.9; font-size: 0.8rem;">
      [(#DESCRIPTIF|textebrut)]   </p>
     [(#TEXTE|replace{'<p', '<p style="text-align: justify;"'})]
  </div>
</div>

<B_fotos>
<section class="gallery">
  <div class="container">
    <div class="gallery-grid">
      
      <BOUCLE_fotos(DOCUMENTS) {id_article} {extension IN jpg,png,gif,webp} {par num titre, id_document}>
      <a href="#URL_DOCUMENT" data-fancybox="album-[(#ID_ARTICLE)]" data-caption="[(#TITRE|sinon{#DESCRIPTIF}|supprimer_tags|attribut_html)]" class="g-item">
        <div style="position: relative; height: 100%;">
          <img src="[(#FICHIER|image_reduire{500,0}|extraire_attribut{src})]" alt="[(#TITRE|sinon{#_principal:TITRE}|supprimer_tags|attribut_html)]" loading="lazy">
        </div>
      </a>
      </BOUCLE_fotos>

    </div>
  </div>
</section>
</B_fotos>

<!-- FOOTER -->

<INCLURE{fond=inclures/footer}{env} />

<!-- BACK TO TOP -->
<a href="#" class="back-top" aria-label="Back to top"><i class="fa fa-arrow-up"></i></a>


<INCLURE{fond=inclures/jotaeses}{env} />

</body>
</html>
</BOUCLE_principale>
