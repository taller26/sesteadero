<BOUCLE_principale(RUBRIQUES) {id_rubrique}>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>#NOM_SITE_SPIP</title>

<INCLURE{fond=inclures/cabeceraparatodos}{env} />



</head>
<body>

<!-- TOPBAR -->
<INCLURE{fond=inclures/topbar}{env} />

<!-- NAVBAR -->
<INCLURE{fond=inclures/navbar}{env} />




<!-- PAGE HEADER -->
<div class="page-header">
  <div class="inner">
    <h1>Nuestras <em>#TITRE</em> de fotos</h1>
    #DESCRIPTIF
   
        
    <div class="breadcrumb">
  <!-- Enlace al inicio del sitio -->
  <a href="#URL_SITE_SPIP">Inicio</a>

  <!-- Recorre las secciones padre si existen -->
  <BOUCLE_ariane(HIERARCHIE) {id_rubrique}>
    <span class="sep"><i class="fa fa-angle-double-right"></i></span>
    <a href="#URL_RUBRIQUE">[(#TITRE|supprimer_numero)]</a>
  </BOUCLE_ariane>

  <!-- Sección actual -->
  <span class="sep"><i class="fa fa-angle-double-right"></i></span>
  <span class="current">[(#TITRE|supprimer_numero)]</span>
</div>



  </div>
</div>

<!-- LISTADO DE ÁLBUMES -->
<section class="gallery">
  <div class="container">
    <div class="text-center">
      <p class="section-label">Galerías</p>
      <h2 class="section-title">Todos los <em>álbumes</em></h2>
      <div class="divider center"></div>
    </div>

<div class="albums-grid">

      <BOUCLE_art_albums(ARTICLES) {id_rubrique} {par date} {inverse}>
      <div class="album-card" data-album='[<BOUCLE_json_imgs(DOCUMENTS) {id_article} {extension IN jpg,png,gif,webp} {par id_document}>{"src":"[(#FICHIER|image_reduire{1200,0}|extraire_attribut{src})]", "alt":"[(#TITRE|sinon{#_art_albums:TITRE}|supprimer_tags|attribut_html)]"}[(#COMPTEUR_BOUCLE|!={#TOTAL_BOUCLE}|oui),][(#SET{total_fotos,#TOTAL_BOUCLE})]</BOUCLE_json_imgs>]'>
        
        <B_portada>
        <BOUCLE_portada(DOCUMENTS) {id_article} {extension IN jpg,png,gif,webp} {par id_document} {inverse} {0,1}>
          <img src="[(#FICHIER|image_reduire{500,0}|image_recadre{384,240,center}|extraire_attribut{src})]" alt="[(#_art_albums:TITRE|attribut_html)]" loading="lazy">
        </BOUCLE_portada>
        </B_portada>
          [<img src="(#LOGO_ARTICLE|image_reduire{500,0}|image_recadre{384,240,center}|extraire_attribut{src})" alt="[(#TITRE|attribut_html)]" loading="lazy">]
        <//B_portada>

        <div class="album-overlay">
          <h3>[(#TITRE|supprimer_numero)]</h3>
          <span class="album-count"><i class="fa fa-images"></i> [(#GET{total_fotos}|sinon{0})] fotos</span>
        </div>
        <div class="album-plus"><i class="fa fa-plus"></i></div>
      </div>
      </BOUCLE_art_albums>

    </div>



  </div>
</section>

<!-- LIGHTBOX DE FOTOS -->
<div class="lightbox-overlay" id="lightbox">
  <div class="lightbox-inner">
    <div class="lightbox-close" id="lbClose"><i class="fa fa-times"></i></div>
    <div class="lightbox-nav prev" id="lbPrev"><i class="fa fa-chevron-left"></i></div>
    <img id="lbImg" src="" alt="">
    <div class="lightbox-nav next" id="lbNext"><i class="fa fa-chevron-right"></i></div>
    <div class="lightbox-counter" id="lbCounter"></div>
  </div>
</div>




<!-- FOOTER -->

<INCLURE{fond=inclures/footer}{env} />

<!-- BACK TO TOP -->
<a href="#" class="back-top" aria-label="Back to top"><i class="fa fa-arrow-up"></i></a>


<INCLURE{fond=inclures/jotaeses}{env} />

</body>
</html>
</BOUCLE_principale>
