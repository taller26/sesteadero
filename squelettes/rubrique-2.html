<BOUCLE_principale(RUBRIQUES) {id_rubrique}>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>#NOM_SITE_SPIP</title>

<INCLURE{fond=inclures/cabeceraparatodos}{env} />



</head>
<body>

<!-- TOPBAR -->
<INCLURE{fond=inclures/topbar}{env} />

<!-- NAVBAR -->
<INCLURE{fond=inclures/navbar}{env} />


<!-- PAGE HEADER -->
<div class="page-header">
  <div class="inner">
    <h1>[(#TITRE|replace{pedagógicos, <em>pedagógicos</em>})]</h1>
    #DESCRIPTIF

<!-- MIGASDEPAN -->
<INCLURE{fond=inclures/migasdepan, id_rubrique} />

  </div>
</div>

<!-- INTRO DE LA SECCIÓN -->
<section class="about">
  <div class="container text-center">
    <p class="section-label">Educación propia</p>
    <h2 class="section-title">Nuestros <em>#TITRE</em></h2>
    <div class="divider center"></div>
    [(#TEXTE|replace{'<p>', '<p class="section-sub" style="max-width:760px">'})]
  </div>
</section>

<!-- LISTADO DE CAMINOS -->
<section class="courses" style="padding-top:0">
  <div class="container">
    <div class="paths-list">

<B_caminos>
<BOUCLE_caminos(ARTICLES) {id_rubrique} {par date} {inverse}>
<a class="path-row" href="#URL_ARTICLE">
  
  <div class="path-img">
    <!-- Intenta cargar la imagen adjunta al artículo -->
    <BOUCLE_img_art(DOCUMENTS) {id_article} {extension IN jpg,png,gif,webp} {par id_document} {inverse} {0,1}>
      <img src="[(#FICHIER|image_reduire{300,0}|extraire_attribut{src})]" alt="[(#_caminos:TITRE|attribut_html)]" loading="lazy">
    </BOUCLE_img_art>
      <!-- Alternativa si no hay documento: Usa el Logo del artículo -->
      [<img src="(#LOGO_ARTICLE|image_reduire{300,0}|extraire_attribut{src})" alt="[(#TITRE|attribut_html)]" loading="lazy">]
    <//B_img_art>
  </div>

  <div class="path-content">
    <h3>[(#TITRE|supprimer_numero)]</h3>
    <p>[(#DESCRIPTIF|sinon{#TEXTE}|supprimer_tags|couper{200})]</p>
    <span class="path-link">Leer artículo completo <i class="fa fa-arrow-right"></i></span>
  </div>

</a>
</BOUCLE_caminos>
</B_caminos>

   

    </div>
  </div>
</section>

<!-- FOOTER -->

<INCLURE{fond=inclures/footer}{env} />

<!-- BACK TO TOP -->
<a href="#" class="back-top" aria-label="Back to top"><i class="fa fa-arrow-up"></i></a>


<INCLURE{fond=inclures/jotaeses}{env} />

</body>
</html>
</BOUCLE_principale>
